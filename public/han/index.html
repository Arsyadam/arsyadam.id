<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>I love you han</title>
<meta name="description" content="I love you han">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: pointer;
  }
  .love-note {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: grid;
    place-items: end center;
    padding: 0 1.25rem 12vh;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .love-note.is-visible {
    opacity: 1;
  }
  .love-note p {
    margin: 0;
    color: #f6d6e0;
    font-size: clamp(1.15rem, 3.6vw, 2rem);
    letter-spacing: 0.12em;
    text-align: center;
    text-shadow:
      0 0 18px rgba(243, 154, 178, 0.55),
      0 0 42px rgba(243, 154, 178, 0.25);
  }
  .credit {
    position: fixed;
    right: 0.75rem;
    bottom: 0.55rem;
    z-index: 3;
    margin: 0;
    color: rgba(255, 255, 255, 0.28);
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    pointer-events: auto;
  }
  .credit a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
  }
  .credit a:hover {
    color: rgba(255, 255, 255, 0.55);
  }
</style>
</head>
<body>
<!--
  ASCII lily bloom adapted from https://github.com/chernobayv/asciiFlowers
  Message overlay for arsyadam.id/han
-->
<canvas id="screen" aria-label="ASCII lilies bloom"></canvas>
<div class="love-note" id="love-note" aria-live="polite">
  <p>I love you han</p>
</div>
<p class="credit">
  lilies after
  <a href="https://github.com/chernobayv/asciiFlowers" target="_blank" rel="noopener noreferrer">asciiFlowers</a>
</p>
<script src="/han/bouquet.js"></script>
<script>
  (() => {
    const note = document.getElementById('love-note');
    // Bloom timeline in bouquet.js opens buds from ~5s; message after the bouquet opens.
    // Keep in sync with bouquet.js ?t= start offset so deep-links still reveal the note.
    const SHOW_AT_S = 12.5;
    const startOffsetS = Math.max(0, Number(new URLSearchParams(location.search).get('t')) || 0);
    let timer = null;

    const hide = () => note.classList.remove('is-visible');
    const show = () => note.classList.add('is-visible');
    const schedule = (offsetS = 0) => {
      hide();
      clearTimeout(timer);
      const delayMs = Math.max(0, (SHOW_AT_S - offsetS) * 1000);
      if (delayMs === 0) {
        show();
        return;
      }
      timer = setTimeout(show, delayMs);
    };

    schedule(startOffsetS);
    // Replay always restarts the bloom at t=0 (see bouquet.js).
    window.addEventListener('ascii-lilies:replay', () => schedule(0));
  })();
</script>
</body>
</html>
